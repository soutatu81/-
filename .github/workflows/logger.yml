name: X Trend Logger

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub Actionsにファイル作成・プッシュの権限を明示的に与える
    permissions:
      contents: write

    steps:
    - name: 画面コードの取得
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 必要なライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 pandas

    - name: Pythonスクリプトの実行
      run: python main.py

    - name: 取得したデータをGitHubに保存（Git Commit & Push）
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git status
        if [ -f trend_log.csv ]; then
          git add trend_log.csv
          git commit -m "Auto update trend log [skip ci]" || echo "No changes to commit"
          git push
        else
          echo "trend_log.csv が見つかりませんでした"
        fi
        
